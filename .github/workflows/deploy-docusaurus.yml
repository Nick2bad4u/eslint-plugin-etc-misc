# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Deploy Documentation Site"
run-name: "Deploy Documentation Site · ${{ github.event_name }} · ${{ github.ref_name || github.sha }}"

on:
    push:
        branches:
            - "main"
        paths:
            - ".github/workflows/deploy-docusaurus.yml"
            - "docs/docusaurus/**"
            - "docs/rules/**"
            - "package.json"
            - "package-lock.json"
            - "src/**"
            - "tsdoc.json"
    workflow_dispatch:

permissions:
    contents: "read"
    pages: "write"
    id-token: "write"

concurrency:
    group: "pages"
    cancel-in-progress: true

defaults:
    run:
        shell: "bash"

jobs:
    build:
        name: "Build docs site"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30

        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0 # Need full history for proper git info

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"
                  node-version-file: ".node-version"

            - name: "Setup pinned npm"
              run: "node scripts/setup-package-manager.mjs --install"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build before TypeDoc"
              run: "npm run build"

            - name: "Check documentation links"
              run: "npm run docs:check-links"

            - name: "Build Docusaurus site"
              run: "npm run docs:build"

            - name: "List TypeDoc output directories"
              run: |
                  echo "TypeDoc output directories:"
                  ls -l docs/docusaurus/site-docs
                  ls -l docs

            - name: "Setup GitHub Pages"
              uses: "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d" # v6.0.0

            - name: "Upload pages artifact"
              uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
              with:
                  path: "docs/docusaurus/build"

    deploy:
        name: "Deploy site"
        runs-on: "ubuntu-latest"
        needs: "build"
        timeout-minutes: 15
        environment:
            name: "github-pages"
            url: "${{ steps.deployment.outputs.page_url }}"

        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Deploy to GitHub Pages"
              id: "deployment"
              uses: "actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128" # v5.0.0
