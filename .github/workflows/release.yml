# Release the npm package and create the matching GitHub release.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Release"

run-name: >-
    ${{
        github.event_name == 'workflow_dispatch' &&
        format('Manual release ({0}) by @{1}', inputs.version || inputs.release_type, github.actor) ||
        startsWith(github.ref, 'refs/tags/v') &&
        format('Tagged release {0} by @{1}', github.ref_name, github.actor) ||
        format('Release recovery from {0} by @{1}', github.ref_name, github.actor)
    }}

concurrency:
    group: "${{ github.workflow }}-${{ github.repository }}"
    cancel-in-progress: "${{ !startsWith(github.ref, 'refs/tags/v') }}"

on:
    push:
        branches:
            - "main"
        tags:
            - "v*"
        paths:
            - ".github/release-recovery.json"
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release bump type"
                required: true
                default: "patch"
                type: "choice"
                options:
                    - "patch"
                    - "minor"
                    - "major"
            version:
                description: "Explicit release version in x.y.z format (overrides release_type)"
                required: false
                type: "string"
            ref:
                description: "Branch to release from when running manually"
                required: false
                default: "main"
                type: "string"
            skip_verify:
                description: "Skip package verification (manual dispatch only; use with caution)"
                required: false
                default: false
                type: "boolean"

defaults:
    run:
        shell: "bash"

jobs:
    publish:
        name: "Publish npm package and GitHub release"
        if: >-
            ${{
                github.event_name == 'workflow_dispatch' ||
                (startsWith(github.ref, 'refs/tags/v') && github.actor != 'github-actions[bot]')
            }}
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        outputs:
            package_name: "${{ steps.version.outputs.package_name }}"
            version: "${{ steps.version.outputs.version }}"
            tag: "${{ steps.version.outputs.tag }}"
            npm_release_url: "${{ steps.version.outputs.npm_release_url }}"
            github_release_url: "${{ steps.version.outputs.github_release_url }}"
        permissions:
            contents: "write"
            id-token: "write"
        env:
            CI: "true"
            DEFAULT_RELEASE_BRANCH: "main"
            NPM_REGISTRY_URL: "https://registry.npmjs.org"
            RELEASE_NOTES_PATH: "temp/release-notes.md"
            RELEASE_ASSETS_DIR: "temp/release-assets"
        concurrency:
            group: "release-pipeline"
            cancel-in-progress: false

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Resolve target ref"
              id: "target_ref"
              env:
                  WORKFLOW_DISPATCH_REF: "${{ inputs.ref }}"
              run: |
                  set -euo pipefail
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    branch="${WORKFLOW_DISPATCH_REF:-}"
                    if [ -z "$branch" ]; then
                      branch="${DEFAULT_RELEASE_BRANCH}"
                    fi
                    branch="${branch#refs/heads/}"
                    if [[ "$branch" == refs/tags/* ]]; then
                      echo "workflow_dispatch ref must be a branch, not a tag: $branch" >&2
                      exit 1
                    fi
                    echo "ref=$branch" >> "$GITHUB_OUTPUT"
                    echo "branch=$branch" >> "$GITHUB_OUTPUT"
                  else
                    echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
                    echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                  fi

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  ref: "${{ steps.target_ref.outputs.ref }}"
                  token: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
                  registry-url: "${{ env.NPM_REGISTRY_URL }}"

            - name: "Setup pinned npm"
              run: "node scripts/setup-package-manager.mjs --install"

            - name: "Locate npm cache"
              id: "npm-cache"
              shell: "bash"
              run: >-
                  echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: "Cache npm downloads"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm-cache.outputs.dir }}"
                  key: "${{ runner.os }}-npm-${{ hashFiles('.node-version', 'package.json', 'package-lock.json') }}"
                  restore-keys: |
                      ${{ runner.os }}-npm-

            - name: "Setup Go for native security scanners"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
              with:
                  go-version: "stable"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Install native lint tools"
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes yamllint
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
                  go install github.com/zricethezav/gitleaks/v8@v8.30.1
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: "Configure Git for release automation"
              if: "github.event_name == 'workflow_dispatch'"
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch --tags --force

            - name: "Validate workflow_dispatch release input"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail
                  explicit_version="${EXPLICIT_VERSION:-}"
                  if [ -n "$explicit_version" ]; then
                    if [[ ! "$explicit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Invalid version input '$explicit_version'. Use x.y.z format." >&2
                      exit 1
                    fi
                    exit 0
                  fi

                  release_type="${RELEASE_TYPE:-patch}"
                  case "$release_type" in
                    patch|minor|major)
                      exit 0
                      ;;
                    *)
                      echo "Invalid release_type '$release_type'. Allowed: patch, minor, major." >&2
                      exit 1
                      ;;
                  esac

            - name: "Validate tag matches package version"
              if: "startsWith(github.ref, 'refs/tags/v')"
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
                    exit 1
                  fi

            - name: "Warn when package verification is skipped"
              if: "${{ github.event_name == 'workflow_dispatch' && inputs.skip_verify }}"
              run: |
                  echo "::warning::Skipping 'Verify package' because workflow_dispatch input 'skip_verify' is true."
                  echo "::warning::Use this only when release checks were validated locally before dispatch."

            - name: "Verify package"
              if: "${{ github.event_name != 'workflow_dispatch' || !inputs.skip_verify }}"
              run: "npm run release:check"

            - name: "Ensure verification did not modify tracked files"
              if: "startsWith(github.ref, 'refs/tags/v')"
              run: |
                  set -euo pipefail
                  if ! git diff --quiet || ! git diff --cached --quiet; then
                    echo "release:check modified files on a tag-triggered release. Ensure main is clean before tagging." >&2
                    git status --short
                    exit 1
                  fi

            - name: "Determine release version"
              id: "version"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    explicit_version="${EXPLICIT_VERSION:-}"
                    if [ -n "$explicit_version" ]; then
                      npm version "$explicit_version" --no-git-tag-version
                      version="$explicit_version"
                    else
                      release_type="${RELEASE_TYPE:-patch}"
                      npm version "$release_type" --no-git-tag-version
                      version=$(node -p "require('./package.json').version")
                    fi
                  else
                    tag="${GITHUB_REF_NAME}"
                    version="${tag#v}"
                  fi

                  package_name=$(node -p "require('./package.json').name")
                  tag="v${version}"
                  npm_release_url="https://www.npmjs.com/package/${package_name}/v/${version}"
                  github_release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"

                  {
                    echo "version=$version"
                    echo "tag=$tag"
                    echo "package_name=$package_name"
                    echo "npm_release_url=$npm_release_url"
                    echo "github_release_url=$github_release_url"
                  } >> "$GITHUB_OUTPUT"

            - name: "Rebuild package after manual version bump"
              if: "github.event_name == 'workflow_dispatch'"
              run: "npm run build"

            - name: "Check whether version is already published"
              id: "npm_check"
              env:
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail
                  if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
                    echo "already_published=true" >> "$GITHUB_OUTPUT"
                    echo "Version ${VERSION} is already published to npm."
                  else
                    echo "already_published=false" >> "$GITHUB_OUTPUT"
                    echo "Version ${VERSION} is available for publishing."
                  fi

            - name: "Prevent duplicate workflow_dispatch release version"
              if: "github.event_name == 'workflow_dispatch' && steps.npm_check.outputs.already_published == 'true'"
              env:
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  echo "Version ${VERSION} is already published. Choose a new release type/version." >&2
                  exit 1

            - name: "Commit and push release version + tag"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  BRANCH: "${{ steps.target_ref.outputs.branch }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  set -euo pipefail

                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists locally." >&2
                    exit 1
                  fi

                  git add -A
                  if git diff --cached --quiet; then
                    echo "No staged changes found for release commit." >&2
                    exit 1
                  fi

                  git commit -m "chore: release ${TAG}"
                  git tag -a "$TAG" -m "$TAG"
                  git push origin "HEAD:${BRANCH}"
                  git push origin "$TAG"

            - name: "Generate release notes from git-cliff"
              env:
                  EXPECTED_TAG: "${{ steps.version.outputs.tag }}"
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_TAG" ]; then
                    echo "::error::The release version step did not provide an expected tag."
                    exit 1
                  fi

                  tag_ref="refs/tags/${EXPECTED_TAG}"
                  if ! git show-ref --verify --quiet "$tag_ref"; then
                    echo "::error::Expected local tag ${EXPECTED_TAG} does not exist."
                    exit 1
                  fi

                  tag_commit=$(git rev-parse "${tag_ref}^{commit}")
                  head_commit=$(git rev-parse HEAD)
                  if [ "$tag_commit" != "$head_commit" ]; then
                    echo "::error::Tag ${EXPECTED_TAG} points to ${tag_commit}, but HEAD is ${head_commit}."
                    exit 1
                  fi

                  head_tags=$(git tag --points-at HEAD --sort=refname)
                  if [ "$head_tags" != "$EXPECTED_TAG" ]; then
                    displayed_head_tags=${head_tags//$'\n'/, }
                    if [ -z "$displayed_head_tags" ]; then
                      displayed_head_tags="(none)"
                    fi
                    echo "::error::Expected ${EXPECTED_TAG} to be the only tag at HEAD, but found: ${displayed_head_tags}."
                    exit 1
                  fi

                  mkdir -p temp
                  node node_modules/git-cliff/lib/cli/cli.js \
                    --config node_modules/gitcliff-config-nick2bad4u/cliff.toml \
                    --github-repo "$GITHUB_REPOSITORY" \
                    --current \
                    --output "${RELEASE_NOTES_PATH}"
                  if [ ! -s "${RELEASE_NOTES_PATH}" ]; then
                    echo "No release notes were generated by git-cliff." > "${RELEASE_NOTES_PATH}"
                  fi

            - name: "Publish to npm"
              if: "steps.npm_check.outputs.already_published != 'true'"
              run: "npm publish --access public --provenance --ignore-scripts"

            - name: "Create release archives"
              id: "release_assets"
              env:
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail

                  assets_dir="${RELEASE_ASSETS_DIR}"
                  unpack_dir="temp/release-package"
                  pack_metadata_path="${assets_dir}/npm-pack.json"
                  mkdir -p "$assets_dir"
                  rm -rf "$unpack_dir"

                  npm pack --json --pack-destination "$assets_dir" > "$pack_metadata_path"

                  tarball_filename=$(
                    node - "$pack_metadata_path" <<'NODE'
                  const fs = require("node:fs");
                  const packMetadata = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                  const entries = Array.isArray(packMetadata)
                    ? packMetadata
                    : Object.values(packMetadata);
                  if (
                    entries.length !== 1 ||
                    typeof entries[0] !== "object" ||
                    entries[0] === null ||
                    typeof entries[0].filename !== "string" ||
                    entries[0].filename.length === 0
                  ) {
                    throw new Error("npm pack returned unexpected metadata");
                  }
                  process.stdout.write(entries[0].filename);
                  NODE
                  )
                  tarball_path="${assets_dir}/${tarball_filename}"
                  safe_package_name=$(printf '%s' "$PACKAGE_NAME" | sed 's/^@//; s#/#-#g')
                  zip_basename="${safe_package_name}-${VERSION}"

                  mkdir -p "$unpack_dir"
                  tar -xzf "$tarball_path" -C "$unpack_dir"
                  mv "$unpack_dir/package" "$unpack_dir/${zip_basename}"

                  (
                    cd "$unpack_dir"
                    zip -rq "../release-assets/${zip_basename}.zip" "${zip_basename}"
                  )

                  {
                    echo "tarball_path=$tarball_path"
                    echo "zip_path=${assets_dir}/${zip_basename}.zip"
                    echo "tarball_name=$tarball_filename"
                    echo "zip_name=${zip_basename}.zip"
                  } >> "$GITHUB_OUTPUT"

            - name: "Create GitHub release"
              uses: "softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228" # v3.0.2
              with:
                  tag_name: "${{ steps.version.outputs.tag }}"
                  name: "${{ steps.version.outputs.tag }}"
                  body_path: "${{ env.RELEASE_NOTES_PATH }}"
                  draft: false
                  files: |
                      ${{ steps.release_assets.outputs.tarball_path }}
                      ${{ steps.release_assets.outputs.zip_path }}
                  fail_on_unmatched_files: true
                  generate_release_notes: false
                  overwrite_files: true
                  prerelease: false
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Release summary"
              if: "${{ !cancelled() }}"
              run: |
                  {
                    echo "## 🚀 Release Summary"
                    echo ""
                    echo "- Event: \`${{ github.event_name }}\`"
                    echo "- Actor: @${{ github.actor }}"
                    echo "- Ref: \`${{ steps.target_ref.outputs.ref }}\`"
                    echo "- Source branch: \`${{ steps.target_ref.outputs.branch }}\`"
                    echo "- Package: \`${{ steps.version.outputs.package_name }}\`"
                    echo "- Version: \`${{ steps.version.outputs.version }}\`"
                    echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
                    echo "- Already published on npm: \`${{ steps.npm_check.outputs.already_published }}\`"
                    echo "- npm package: [${{ steps.version.outputs.package_name }}@${{ steps.version.outputs.version }}](${{ steps.version.outputs.npm_release_url }})"
                    echo "- GitHub release: [${{ steps.version.outputs.tag }}](${{ steps.version.outputs.github_release_url }})"
                    echo "- Release assets: \`${{ steps.release_assets.outputs.tarball_name }}\`, \`${{ steps.release_assets.outputs.zip_name }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"

    recover:
        name: "Recover interrupted tagged release"
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        permissions:
            contents: "write"
            id-token: "write"
        env:
            CI: "true"
            NPM_REGISTRY_URL: "https://registry.npmjs.org"
            RELEASE_NOTES_PATH: "temp/release-notes.md"
            RELEASE_ASSETS_DIR: "temp/release-assets"
        concurrency:
            group: "release-pipeline"
            cancel-in-progress: false

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout recovery declaration"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: "Validate recovery declaration and release identities"
              id: "recovery"
              env:
                  RECOVERY_PATH: ".github/release-recovery.json"
              run: |
                  set -euo pipefail

                  node --input-type=module - "$RECOVERY_PATH" "$GITHUB_OUTPUT" <<'NODE'
                  import { appendFile, readFile } from "node:fs/promises";

                  const [recoveryPath, outputPath] = process.argv.slice(2);
                  const declaration = JSON.parse(await readFile(recoveryPath, "utf8"));
                  const keys = Object.keys(declaration).sort();
                  const expectedKeys = ["failedRunId", "releaseCommit", "tag", "version"];

                  if (JSON.stringify(keys) !== JSON.stringify(expectedKeys)) {
                    throw new Error(`Recovery declaration keys must be: ${expectedKeys.join(", ")}`);
                  }
                  if (typeof declaration.version !== "string" || !/^\d+\.\d+\.\d+$/.test(declaration.version)) {
                    throw new Error("Recovery version must use x.y.z format.");
                  }
                  if (declaration.tag !== `v${declaration.version}`) {
                    throw new Error("Recovery tag must exactly match the declared version.");
                  }
                  if (typeof declaration.releaseCommit !== "string" || !/^[0-9a-f]{40}$/.test(declaration.releaseCommit)) {
                    throw new Error("Recovery releaseCommit must be a full lowercase Git SHA.");
                  }
                  if (!Number.isSafeInteger(declaration.failedRunId) || declaration.failedRunId <= 0) {
                    throw new Error("Recovery failedRunId must be a positive integer.");
                  }

                  await appendFile(
                    outputPath,
                    [
                      `version=${declaration.version}`,
                      `tag=${declaration.tag}`,
                      `release_commit=${declaration.releaseCommit}`,
                      `failed_run_id=${declaration.failedRunId}`,
                    ].join("\n") + "\n",
                  );
                  NODE

                  version=$(node -p "require('./.github/release-recovery.json').version")
                  tag=$(node -p "require('./.github/release-recovery.json').tag")
                  release_commit=$(node -p "require('./.github/release-recovery.json').releaseCommit")

                  if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
                    echo "::error::Recovery tag ${tag} does not exist."
                    exit 1
                  fi

                  tag_commit=$(git rev-parse "refs/tags/${tag}^{commit}")
                  if [ "$tag_commit" != "$release_commit" ]; then
                    echo "::error::Recovery tag ${tag} points to ${tag_commit}, not ${release_commit}."
                    exit 1
                  fi

                  package_version=$(git show "${release_commit}:package.json" | node -e \
                    'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data).version));')
                  if [ "$package_version" != "$version" ]; then
                    echo "::error::Tagged package version ${package_version} does not match ${version}."
                    exit 1
                  fi

                  mapfile -t changed_files < <(git diff --name-only "$release_commit" HEAD)
                  expected_files=(
                    ".github/release-recovery.json"
                    ".github/workflows/release.yml"
                  )
                  if [ "${changed_files[*]}" != "${expected_files[*]}" ]; then
                    printf '::error::Recovery commit contains changes outside the approved recovery files: %s\n' \
                      "${changed_files[*]:-(none)}"
                    exit 1
                  fi

                  current_version=$(node -p "require('./package.json').version")
                  if [ "$current_version" != "$version" ]; then
                    echo "::error::Recovery package version ${current_version} does not match ${version}."
                    exit 1
                  fi

                  package_name=$(node -p "require('./package.json').name")
                  {
                    echo "package_name=$package_name"
                    echo "npm_release_url=https://www.npmjs.com/package/${package_name}/v/${version}"
                    echo "github_release_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
                  } >> "$GITHUB_OUTPUT"

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
                  registry-url: "${{ env.NPM_REGISTRY_URL }}"

            - name: "Setup pinned npm"
              run: "node scripts/setup-package-manager.mjs --install"

            - name: "Locate npm cache"
              id: "recovery-npm-cache"
              run: >-
                  echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: "Cache npm downloads"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.recovery-npm-cache.outputs.dir }}"
                  key: "${{ runner.os }}-npm-${{ hashFiles('.node-version', 'package.json', 'package-lock.json') }}"
                  restore-keys: |
                      ${{ runner.os }}-npm-

            - name: "Setup Go for native security scanners"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
              with:
                  go-version: "stable"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Install native lint tools"
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes yamllint
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
                  go install github.com/zricethezav/gitleaks/v8@v8.30.1
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: "Verify tagged package"
              run: "npm run release:check"

            - name: "Confirm release is still recoverable"
              id: "recovery-state"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  PACKAGE_NAME: "${{ steps.recovery.outputs.package_name }}"
                  TAG: "${{ steps.recovery.outputs.tag }}"
                  VERSION: "${{ steps.recovery.outputs.version }}"
              run: |
                  set -euo pipefail

                  already_published=false
                  if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
                    registry_integrity=$(npm view "${PACKAGE_NAME}@${VERSION}" dist.integrity)
                    integrity_dir="temp/recovery-integrity"
                    integrity_metadata_path="${integrity_dir}/npm-pack.json"
                    mkdir -p "$integrity_dir"
                    npm pack --json --pack-destination "$integrity_dir" > "$integrity_metadata_path"
                    local_integrity=$(node - "$integrity_metadata_path" <<'NODE'
                  const fs = require("node:fs");
                  const packMetadata = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                  const entries = Array.isArray(packMetadata) ? packMetadata : Object.values(packMetadata);
                  if (
                    entries.length !== 1 ||
                    typeof entries[0] !== "object" ||
                    entries[0] === null ||
                    typeof entries[0].integrity !== "string" ||
                    entries[0].integrity.length === 0
                  ) {
                    throw new Error("npm pack returned unexpected integrity metadata");
                  }
                  process.stdout.write(entries[0].integrity);
                  NODE
                    )
                    if [ "$local_integrity" != "$registry_integrity" ]; then
                      echo "::error::Published ${PACKAGE_NAME}@${VERSION} integrity does not match the recovery artifact."
                      exit 1
                    fi
                    already_published=true
                    echo "${PACKAGE_NAME}@${VERSION} is already published with matching integrity."
                  fi

                  already_released=false
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    if [ "$already_published" != "true" ]; then
                      echo "::error::GitHub release ${TAG} exists, but ${PACKAGE_NAME}@${VERSION} is not published."
                      exit 1
                    fi
                    release_state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                      --json isDraft,isPrerelease,tagName \
                      --jq '[.tagName, (.isDraft | tostring), (.isPrerelease | tostring)] | @tsv')
                    IFS=$'\t' read -r release_tag release_draft release_prerelease <<< "$release_state"
                    if [ "$release_tag" != "$TAG" ] || [ "$release_draft" != "false" ] || [ "$release_prerelease" != "false" ]; then
                      echo "::error::Existing GitHub release ${TAG} is not the expected final release."
                      exit 1
                    fi
                    already_released=true
                    echo "GitHub release ${TAG} already exists in final form."
                  fi

                  {
                    echo "already_published=$already_published"
                    echo "already_released=$already_released"
                  } >> "$GITHUB_OUTPUT"

            - name: "Generate release notes from git-cliff"
              if: "steps.recovery-state.outputs.already_released != 'true'"
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  RELEASE_COMMIT: "${{ steps.recovery.outputs.release_commit }}"
              run: |
                  set -euo pipefail
                  mkdir -p temp
                  recovery_commit=$(git rev-parse HEAD)
                  git checkout --detach "$RELEASE_COMMIT"
                  node node_modules/git-cliff/lib/cli/cli.js \
                    --config node_modules/gitcliff-config-nick2bad4u/cliff.toml \
                    --github-repo "$GITHUB_REPOSITORY" \
                    --current \
                    --output "${RELEASE_NOTES_PATH}"
                  git checkout --detach "$recovery_commit"
                  if [ ! -s "${RELEASE_NOTES_PATH}" ]; then
                    echo "No release notes were generated by git-cliff." > "${RELEASE_NOTES_PATH}"
                  fi

            - name: "Publish to npm"
              if: "steps.recovery-state.outputs.already_published != 'true'"
              run: "npm publish --access public --provenance --ignore-scripts"

            - name: "Create release archives"
              id: "recovery-assets"
              if: "steps.recovery-state.outputs.already_released != 'true'"
              env:
                  PACKAGE_NAME: "${{ steps.recovery.outputs.package_name }}"
                  VERSION: "${{ steps.recovery.outputs.version }}"
              run: |
                  set -euo pipefail

                  assets_dir="${RELEASE_ASSETS_DIR}"
                  unpack_dir="temp/release-package"
                  pack_metadata_path="${assets_dir}/npm-pack.json"
                  mkdir -p "$assets_dir"
                  rm -rf "$unpack_dir"

                  npm pack --json --pack-destination "$assets_dir" > "$pack_metadata_path"
                  tarball_filename=$(node - "$pack_metadata_path" <<'NODE'
                  const fs = require("node:fs");
                  const packMetadata = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                  const entries = Array.isArray(packMetadata) ? packMetadata : Object.values(packMetadata);
                  if (
                    entries.length !== 1 ||
                    typeof entries[0] !== "object" ||
                    entries[0] === null ||
                    typeof entries[0].filename !== "string" ||
                    entries[0].filename.length === 0
                  ) {
                    throw new Error("npm pack returned unexpected metadata");
                  }
                  process.stdout.write(entries[0].filename);
                  NODE
                  )
                  tarball_path="${assets_dir}/${tarball_filename}"
                  safe_package_name=$(printf '%s' "$PACKAGE_NAME" | sed 's/^@//; s#/#-#g')
                  zip_basename="${safe_package_name}-${VERSION}"

                  mkdir -p "$unpack_dir"
                  tar -xzf "$tarball_path" -C "$unpack_dir"
                  mv "$unpack_dir/package" "$unpack_dir/${zip_basename}"
                  (
                    cd "$unpack_dir"
                    zip -rq "../release-assets/${zip_basename}.zip" "${zip_basename}"
                  )

                  {
                    echo "tarball_path=$tarball_path"
                    echo "zip_path=${assets_dir}/${zip_basename}.zip"
                    echo "tarball_name=$tarball_filename"
                    echo "zip_name=${zip_basename}.zip"
                  } >> "$GITHUB_OUTPUT"

            - name: "Create GitHub release"
              if: "steps.recovery-state.outputs.already_released != 'true'"
              uses: "softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228" # v3.0.2
              with:
                  tag_name: "${{ steps.recovery.outputs.tag }}"
                  name: "${{ steps.recovery.outputs.tag }}"
                  body_path: "${{ env.RELEASE_NOTES_PATH }}"
                  draft: false
                  files: |
                      ${{ steps.recovery-assets.outputs.tarball_path }}
                      ${{ steps.recovery-assets.outputs.zip_path }}
                  fail_on_unmatched_files: true
                  generate_release_notes: false
                  overwrite_files: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Recovery summary"
              if: "${{ !cancelled() }}"
              run: |
                  {
                    echo "## Release Recovery Summary"
                    echo ""
                    echo "- Failed run: [${{ steps.recovery.outputs.failed_run_id }}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ steps.recovery.outputs.failed_run_id }})"
                    echo "- Release commit: \`${{ steps.recovery.outputs.release_commit }}\`"
                    echo "- Package: \`${{ steps.recovery.outputs.package_name }}@${{ steps.recovery.outputs.version }}\`"
                    echo "- Tag: \`${{ steps.recovery.outputs.tag }}\`"
                    echo "- Already published on npm: \`${{ steps.recovery-state.outputs.already_published }}\`"
                    echo "- GitHub release already existed: \`${{ steps.recovery-state.outputs.already_released }}\`"
                    echo "- npm package: [${{ steps.recovery.outputs.npm_release_url }}](${{ steps.recovery.outputs.npm_release_url }})"
                    echo "- GitHub release: [${{ steps.recovery.outputs.github_release_url }}](${{ steps.recovery.outputs.github_release_url }})"
                    echo "- Release assets: \`${{ steps.recovery-assets.outputs.tarball_name }}\`, \`${{ steps.recovery-assets.outputs.zip_name }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
